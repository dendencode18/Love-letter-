<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isang Munting Tanong 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px 12px;background:linear-gradient(145deg,#ffdbe8,#fff2f6,#ffcbdc);font-family:"Trebuchet MS",Arial,sans-serif;color:#79334d;overflow-x:hidden}
.card{position:relative;z-index:2;width:100%;max-width:390px;padding:27px 21px;background:rgba(255,255,255,.92);border:2px solid #ffc0d5;border-radius:28px;text-align:center;box-shadow:0 12px 35px #cf628126;animation:appear .5s ease}
h1{font-size:27px;color:#d94379;margin:10px 0 14px}
p{font-size:16px;line-height:1.7}
.emoji{font-size:55px;animation:float 2s ease-in-out infinite}
button,.link{display:block;width:100%;padding:14px;margin-top:13px;border:0;border-radius:30px;font-family:inherit;font-size:16px;font-weight:bold;text-decoration:none;cursor:pointer;transition:transform .2s}
button:active,.link:active{transform:scale(.97)}
.yes,.main,.link{background:linear-gradient(90deg,#f45b91,#e83e7d);color:white;box-shadow:0 5px 13px #f5a5c166}
.no{background:#fff0f5;color:#ce4777;border:1px solid #f5a1bf}
.small{font-size:12px;opacity:.8}
.music{font-size:12px;background:#fff0f5;border:1px solid #ffc0d5;border-radius:18px;padding:8px;margin-top:14px}
.heart{position:fixed;bottom:-35px;z-index:1;pointer-events:none;animation:rise 5s linear forwards}
@keyframes appear{from{opacity:0;transform:translateY(15px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes rise{to{transform:translateY(-110vh) rotate(35deg);opacity:0}}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="emoji">💌</div>
  <h1>Isang Munting Tanong</h1>
  <p>Hi! 🩷<br><br>May itatanong lang sana ako sa'yo. Okay lang ba kung magpasagot ako sa'yo ng ilang tanong? Walang pressure—ikaw ang bahala sa sagot mo.</p>
  <button class="main" onclick="page('q1')">Sige, simulan natin 💗</button>
  <p class="small">Dahan-dahan lang. Sagot nang tapat. ♡</p>
  <div class="music" id="musicStatus">🎵 Wala pang music — magsisimula kapag sumagot ka.</div>
</main>

<!-- Ilagay ang sarili mong legal na audio files sa parehong folder:
     Calein - Umaasa (Official Lyric Video).mp3 at Boyz II Men - On Bended Knee.mp3 -->
<audio id="yesSong" src="Calein - Umaasa (Official Lyric Video).mp3" preload="auto" loop></audio>
<audio id="noSong" src="Boyz II Men - On Bended Knee.mp3" preload="auto" loop></audio>

<script>
const card=document.getElementById('card');
const yesSong=document.getElementById('yesSong');
const noSong=document.getElementById('noSong');
const musicStatus=document.getElementById('musicStatus');
let currentSong='';

function playSong(which){
  const next = which==='yes' ? yesSong : noSong;
  const other = which==='yes' ? noSong : yesSong;
  other.pause();
  other.currentTime=0;
  currentSong=which;
  musicStatus.textContent = which==='yes'
    ? '🎵 Playing: “Umaasa” — Calein'
    : '🎵 Playing: “On Bended Knee” — Boyz II Men';
  next.play().catch(()=>{
    musicStatus.textContent += ' (Kung hindi tumugtog, tiyaking nasa folder ang MP3 at pindutin ulit ang sagot.)';
  });
}
function chooseYes(nextPage){
  playSong('yes');
  page(nextPage);
}
function chooseNo(nextPage){
  playSong('no');
  page(nextPage);
}
function render(html){card.style.animation='none';card.offsetHeight;card.style.animation='appear .5s ease';card.innerHTML=html+`<div class="music" id="musicStatus">${currentSong==='yes'?'🎵 Playing: “Umaasa” — Calein':currentSong==='no'?'🎵 Playing: “On Bended Knee” — Boyz II Men':'🎵 Wala pang music — magsisimula kapag sumagot ka.'}</div>`}
function page(which){
 if(which==='q1') question('Okay lang ba sa’yo na sagutin ang ilang tanong ko?','q1yes','q1no');
 if(which==='q1yes') confirm('Sigurado ka bang gusto mong magpatuloy? 🌷','Walang tamang sagot dito. Puwede kang magpatuloy o huminto kahit kailan.','q2','q1');
 if(which==='q1no') confirm('Sure ka bang ayaw mong magpatuloy? 🤍','Okay lang kung hindi ka komportable. Gusto ko lang siguraduhin na iyon talaga ang gusto mo.','noend','q1');
 if(which==='q2') question('Komportable ka bang sagutin ang ilang tanong, kung mayroon? 🫶','q2yes','q2no');
 if(which==='q2yes') confirm('Okay ka pa bang magpatuloy? 💕','Puwede mong laktawan ang anumang tanong na ayaw mong sagutin.','q3','q2');
 if(which==='q2no') confirm('Mas gusto mo bang huminto muna? 🌸','Walang problema. Hindi mo kailangang sagutin ang anumang bagay na hindi ka komportable.','noend','q2');
 if(which==='q3') question('Gusto mo bang ituloy hanggang sa huling tanong? ✨','q3yes','q3no');
 if(which==='q3yes') confirm('Final na ba ang sagot mong OO? 💖','Salamat! Ilang sandali na lang at makikita mo ang huling bahagi.','finalyes','q3');
 if(which==='q3no') confirm('Sigurado ka bang ayaw mo nang magpatuloy? 🤍','Puwede kang huminto rito. Salamat pa rin sa oras mo.','noend','q3');
 if(which==='finalyes') render(`<div class="emoji">🎀💗</div><h1>Salamat sa pagsagot!</h1><p>Yay! Nakarating ka sa dulo. May ilang huling tanong pa sa form. Sagutin mo lang kung komportable ka. 💌</p><a class="link" href="https://forms.gle/sEFzx3LTGgfauHxw6" target="_blank" rel="noopener">Buksan ang Google Form ↗</a><p class="small">I-tap ang button para buksan ang form.</p>`);
 if(which==='noend') render(`<div class="emoji">🌷🤍</div><h1>Salamat pa rin!</h1><p>Salamat sa paglalaan ng oras. Ayos lang kung ayaw mong magpatuloy—iginagalang ko ang sagot mo. Ingat palagi. ♡</p><button class="no" onclick="page('q1')">Balikan ang unang tanong</button>`);
}
function question(text,yes,no){render(`<div class="emoji">💗</div><h1>May tanong ako...</h1><p>${text}</p><button class="yes" onclick="chooseYes('${yes}')">Oo 💖</button><button class="no" onclick="chooseNo('${no}')">Hindi 🤍</button><p class="small">Ikaw ang bahala—walang pressure. ♡</p>`)}
function confirm(title,text,yes,no){render(`<div class="emoji">🥹💕</div><h1>${title}</h1><p>${text}</p><button class="yes" onclick="chooseYes('${yes}')">Oo, sige 💗</button><button class="no" onclick="chooseNo('${no}')">Hindi / Pag-isipan muna</button>`)}
function heart(){const h=document.createElement('span');h.className='heart';h.textContent=['💗','💕','♡','🌸','💖'][Math.floor(Math.random()*5)];h.style.left=Math.random()*100+'vw';h.style.fontSize=(16+Math.random()*20)+'px';h.style.animationDuration=(4+Math.random()*3)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),7000)}
setInterval(heart,550);
</script>
</body>
</html>
